# Descarga las calles de zona regulada (Madrid, Barcelona, Valencia) de los datos abiertos
# de los ayuntamientos y las guarda en Supabase una vez por semana.
name: Importar zonas reguladas

on:
  schedule:
    - cron: "0 4 * * 2" # martes a las 04:00 UTC
  workflow_dispatch: {}

concurrency:
  group: importar-zonas
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Importar zonas reguladas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/importar-zonas.mts
