# Descarga parkings y parquímetros de OpenStreetMap y los guarda en Supabase una vez por semana.
# Usa los mismos secrets que "Importar precios": SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY.
name: Importar aparcamientos

on:
  schedule:
    - cron: "30 3 * * 1" # lunes a las 03:30 UTC
  workflow_dispatch: {}

concurrency:
  group: importar-aparcamientos
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Importar parkings y parquímetros (provincia de Alicante)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/importar-aparcamientos.mts
